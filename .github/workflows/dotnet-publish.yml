name: .NET Publish

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: src/global.json

    - name: Build & Publish
      run: dotnet fsi ./src/build.fsx -- -p Publish
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}